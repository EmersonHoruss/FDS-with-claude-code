<mat-button-toggle-group
  name="taskFilter"
  aria-label="Task Filter"
  [value]="tasksFilterFacade.activeFilterId$ | async"
  [disabled]="taskFacade.loading$ | async"
>
  <mat-button-toggle
    *ngFor="let filter of tasksFilterFacade.filters"
    [value]="filter.id"
    (click)="tasksFilterFacade.selectFilter(filter.id)"
  >
    {{ filter.title }}
  </mat-button-toggle>
</mat-button-toggle-group>
